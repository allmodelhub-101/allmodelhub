name: Responsive foundation
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: responsive-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - run: npm install --global pnpm@10.34.3
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit:routes && pnpm audit:css
      - run: git diff --exit-code -- docs/mobile-route-inventory.json docs/mobile-route-inventory.md docs/mobile-css-evidence.json docs/mobile-css-evidence.md
      - run: pnpm exec playwright install --with-deps chromium webkit
      - name: All viewport projects / both browser engines
        run: pnpm test:responsive
        env:
          CI: 'true'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ !cancelled() }}
        with:
          name: responsive-foundation
          path: |
            playwright-report/
            test-results/**/results.json
          retention-days: 7
          if-no-files-found: warn
